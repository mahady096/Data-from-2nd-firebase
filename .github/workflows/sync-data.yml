name: Sync Data from Other Firebase

on:
  schedule:
    - cron: '0 10 * * *'   # প্রতিদিন বাংলাদেশ সময় বিকাল ৪টায় (UTC 10:00)
  workflow_dispatch:        # ম্যানুয়ালি চালানোর জন্য বাটন

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'   # Node.js 24 বাধ্যতামূলক

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # Node.js 24 ব্যবহার করবে

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run sync script
        env:
          SOURCE_FIREBASE_SA: ${{ secrets.SOURCE_FIREBASE_SA }}
        run: node scripts/sync-data.js
